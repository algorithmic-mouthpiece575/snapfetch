# SnapFetch backend — snapfetch-server.duckdns.org
# Reverse proxy to the Node container (Docker, bound to 127.0.0.1:3007).
#
# Install:
#   sudo cp deploy/nginx/snapfetch-backend.conf /etc/nginx/sites-available/snapfetch-backend
#   sudo ln -s /etc/nginx/sites-available/snapfetch-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d snapfetch-server.duckdns.org   # adds the 443 block

server {
    listen 80;
    listen [::]:80;
    server_name snapfetch-server.duckdns.org;

    # Allow large media responses.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend prepares the file (download + merge) before streaming it:
        # generous timeouts + no buffering so long downloads are not cut off.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
