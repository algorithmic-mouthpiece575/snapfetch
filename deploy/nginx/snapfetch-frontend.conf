# SnapFetch frontend — snapfetch.harden-tech.com
# Serves the static Vite build (client/dist copied to /var/www/snapfetch).
#
# Install:
#   sudo cp deploy/nginx/snapfetch-frontend.conf /etc/nginx/sites-available/snapfetch-frontend
#   sudo ln -s /etc/nginx/sites-available/snapfetch-frontend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d snapfetch.harden-tech.com   # adds the 443 block

server {
    listen 80;
    listen [::]:80;
    server_name snapfetch.harden-tech.com;

    root /var/www/snapfetch;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
