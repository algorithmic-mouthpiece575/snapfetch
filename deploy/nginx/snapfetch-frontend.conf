# SnapFetch frontend — snapfetch.harden-tech.com
# Reverse proxy to the frontend container (Docker, bound to 127.0.0.1:3008).
#
# Install:
#   sudo cp deploy/nginx/snapfetch-frontend.conf /etc/nginx/sites-available/snapfetch-frontend
#   sudo ln -s /etc/nginx/sites-available/snapfetch-frontend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d snapfetch.harden-tech.com   # adds the 443 block

server {
    listen 80;
    listen [::]:80;
    server_name snapfetch.harden-tech.com;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
