# SnapFetch — nginx server block (reverse proxy + static frontend)
#
# Install:
#   sudo cp snapfetch.nginx.conf /etc/nginx/sites-available/snapfetch
#   sudo ln -s /etc/nginx/sites-available/snapfetch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (recommended): run certbot, it edits this file to add the 443 block:
#   sudo certbot --nginx -d votre-domaine.com

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.com;

    # Frontend: static Vite build. Point this at your client/dist
    # (e.g. copy it to /var/www/snapfetch — see the deployment guide).
    root /var/www/snapfetch;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Allow large request bodies / media responses.
    client_max_body_size 64m;

    # API → Node backend (Docker, bound to 127.0.0.1:3001).
    # No trailing slash on proxy_pass: the full /api/... path is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend prepares the file (download + merge) before streaming it:
        # generous timeouts + no buffering so long downloads are not cut off.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Frontend (SPA routing): fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
