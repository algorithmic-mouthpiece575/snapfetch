# In-container nginx serving the static Vite build on port 3008.
# The host nginx (TLS) reverse-proxies snapfetch.harden-tech.com → 127.0.0.1:3008.
server {
    listen 3008;
    listen [::]:3008;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
